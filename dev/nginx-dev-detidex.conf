# Reverse proxy for Vite dev server so the app is reachable at https://dev.detidex.yeuthich.net
# Adjust certificate paths to your local certs (mkcert/letsencrypt/etc.).

# Upgrade mapping for websocket/HMR
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl http2;
  server_name dev.detidex.yeuthich.net;

  ssl_certificate     /etc/ssl/certs/dev.detidex.yeuthich.net.crt;
  ssl_certificate_key /etc/ssl/private/dev.detidex.yeuthich.net.key;
  # add ssl_trusted_certificate if your CA chain is separate

  # Optional: force HSTS only if you trust the cert in your browser
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
  }
}

server {
  listen 80;
  server_name dev.detidex.yeuthich.net;
  return 301 https://$host$request_uri;
}
